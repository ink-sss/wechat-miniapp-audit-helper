name: Feature request
description: Suggest a focused improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Keep the submission path conservative; no automatic retry after an uncertain response.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks or edge cases
      description: Account switching, token changes, special review flows, or schema changes.
    validations:
      required: false
